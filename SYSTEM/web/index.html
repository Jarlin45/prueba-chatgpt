<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema Personal v0.3</title><style>body{font-family:system-ui;max-width:760px;margin:auto;padding:24px}textarea,input,button{width:100%;padding:14px;margin-top:10px;box-sizing:border-box}button{cursor:pointer}.card{padding:16px;border:1px solid #ddd;border-radius:12px;margin-top:16px}.ok{font-weight:600}.warn{font-weight:600}.meta{font-size:.9rem;opacity:.75}</style></head><body><h1>Sistema Personal v0.3</h1><p>Orquestador → Skill → Motor → Evidencia → Verificación</p><textarea id="problem" rows="5" placeholder="Describe el problema..."></textarea><input id="repository" value="Jarlin45/prueba-chatgpt" placeholder="owner/repo"><button id="run" onclick="diagnose()">Ejecutar diagnóstico real</button><div id="result" class="card">Esperando un problema.</div><script>async function diagnose(){const p=document.getElementById('problem').value.trim(),repo=document.getElementById('repository').value.trim(),r=document.getElementById('result'),b=document.getElementById('run');if(!p){r.textContent='Escribe un problema.';return}b.disabled=true;b.textContent='Consultando GitHub...';r.textContent='Ejecutando motor...';try{const res=await fetch('/api/diagnose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({problem:p,repository:repo})});const data=await res.json();if(!res.ok||data.status==='error')throw new Error(data.error||'Error en diagnóstico');r.innerHTML='<div class="ok">✓ Diagnóstico ejecutado con evidencia real</div><p><b>Repositorio:</b> '+data.evidence.repository+'</p><p><b>Rama:</b> '+data.evidence.default_branch+'</p><p><b>Privado:</b> '+data.evidence.private+'</p><p class="meta">Fuente: '+data.evidence.source+' · Verificación ejecutada: '+data.verification.executed+'</p>'}catch(e){r.innerHTML='<div class="warn">⚠ No se pudo completar</div><p>'+e.message+'</p>'}finally{b.disabled=false;b.textContent='Ejecutar diagnóstico real'}}</script></body></html>
