<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema Personal v0.2</title><style>body{font-family:system-ui;max-width:760px;margin:auto;padding:24px}textarea,select,button{width:100%;padding:14px;margin-top:10px;box-sizing:border-box}button{cursor:pointer}.card{padding:16px;border:1px solid #ddd;border-radius:12px;margin-top:16px}.ok{font-weight:600}.warn{font-weight:600}</style></head><body><h1>Sistema Personal v0.2</h1><p>Orquestador → Skill → Motor → Verificación</p><textarea id="problem" rows="5" placeholder="Describe el problema..."></textarea><label><input id="auth" type="checkbox" checked> GitHub autenticado</label><label><input id="app" type="checkbox" checked> App instalada</label><label><input id="repo" type="checkbox" checked> Repositorio visible</label><label><input id="write" type="checkbox"> Permiso de escritura</label><button onclick="diagnose()">Ejecutar diagnóstico</button><div id="result" class="card">Esperando un problema.</div><script>function diagnose(){const p=document.getElementById('problem').value.trim();if(!p){document.getElementById('result').textContent='Escribe un problema.';return}const ctx={authenticated:auth.checked,app_installed:app.checked,repository_visible:repo.checked,writable:write.checked};const missing=[];if(!ctx.authenticated)missing.push('autenticación');if(!ctx.app_installed)missing.push('instalación de App');if(!ctx.repository_visible)missing.push('visibilidad del repositorio');document.getElementById('result').innerHTML=missing.length?'<div class="warn">⚠ Atención requerida</div><p>El diagnóstico detectó: '+missing.join(', ')+'</p><p>Flujo ejecutado: problema → orquestador → skill GitHub → motor → hallazgo → verificación.</p>':'<div class="ok">✓ Sin hallazgos en las comprobaciones disponibles</div><p>Verificación: el circuito de diagnóstico se ejecutó correctamente.</p>'}</script></body></html>
